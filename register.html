<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | CheapNaria</title>
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-container">

    <div class="auth-card animate-up">
        <div class="auth-header">
            <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 2rem;">
                <img src="images/logo-icon.png" class="logo-icon-img" alt="CheapNaria">
                <span>CheapNaria</span>
            </a>
        </div>

        <div class="auth-tabs">
            <a href="login.html" class="auth-tab">Login</a>
            <a href="register.html" class="auth-tab active">Register</a>
        </div>

        <div class="auth-header" style="margin-bottom: 2rem;">
            <h2 style="font-size: 2rem; color: var(--secondary); letter-spacing: -1px;">Create account</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Infrastructure for high-frequency traders</p>
        </div>

        <form action="verify-code.html">
            <div class="register-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" placeholder="John" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" placeholder="Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email or Phone Number</label>
                <input type="text" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label>Create Password</label>
                <div class="password-field-container">
                    <input type="password" class="pw-input" id="createPassword" placeholder="Min. 8 characters" required>
                    <i class="far fa-eye pw-toggle"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <div class="password-field-container">
                    <input type="password" class="pw-input" id="confirmPassword" placeholder="Re-enter your password" required>
                    <i class="far fa-eye pw-toggle"></i>
                </div>
                <small id="pwMismatchError" style="display:none; color:#ef4444; font-weight:600; margin-top:0.5rem;">Passwords
                    do not match.</small>
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; margin-top: 1rem; border-radius: 12px; padding: 1rem;">
                Create Account <i class="fas fa-user-plus ms-2"></i>
            </button>
        </form>

        <div class="social-login-divider">or continue with</div>
        <div class="social-login-row">
            <button type="button" class="social-btn" aria-label="Continue with Google"><i
                    class="fab fa-google"></i></button>
            <button type="button" class="social-btn" aria-label="Continue with Apple"><i
                    class="fab fa-apple"></i></button>
            <button type="button" class="social-btn" aria-label="Continue with Email"><i
                    class="fas fa-envelope"></i></button>
        </div>

        <div style="margin-top: 2.5rem; padding-top: 2rem; border-top: 1.5px solid #f1f5f9; text-align: center;">
            <p style="color: var(--text-muted); font-size: 0.95rem;">
                Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Login</a>
            </p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $('.pw-toggle').on('click', function () {
                const input = $(this).siblings('.pw-input');
                const type = input.attr('type') === 'password' ? 'text' : 'password';
                input.attr('type', type);
                $(this).toggleClass('fa-eye fa-eye-slash');
            });

            $('form').on('submit', function (e) {
                if ($('#createPassword').val() !== $('#confirmPassword').val()) {
                    e.preventDefault();
                    $('#pwMismatchError').show();
                    $('#confirmPassword').trigger('focus');
                } else {
                    $('#pwMismatchError').hide();
                }
            });

            $('#confirmPassword').on('input', function () {
                $('#pwMismatchError').hide();
            });
        });
    </script>
</body>

</html>
