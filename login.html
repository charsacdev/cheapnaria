<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CheapNaria</title>
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-container">

    <div class="auth-card animate-up">
        <div class="auth-header">
            <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 2rem;">
                <img src="images/logo-icon.png" class="logo-icon-img" alt="CheapNaria">
                <span>CheapNaria</span>
            </a>
        </div>

        <div class="auth-tabs">
            <a href="login.html" class="auth-tab active">Login</a>
            <a href="register.html" class="auth-tab">Register</a>
        </div>

        <div class="auth-header" style="margin-bottom: 2rem;">
            <h2 style="font-size: 2rem; color: var(--secondary); letter-spacing: -1px;">Welcome back!</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Login to your CheapNaria account</p>
        </div>

        <form action="dashboard/index.html">
            <div class="form-group">
                <label>Email or Phone Number</label>
                <input type="text" placeholder="name@email.com" required>
            </div>
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem;">
                    <label style="margin: 0;">Password</label>
                    <a href="forgot-password.html"
                        style="font-size: 0.85rem; color: var(--primary); font-weight: 700;">Forgot?</a>
                </div>
                <input type="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; margin-top: 1rem; border-radius: 12px; padding: 1rem;">
                Login <i class="fas fa-arrow-right-to-bracket ms-2"></i>
            </button>
        </form>

        <div class="social-login-divider">or continue with</div>
        <div class="social-login-row">
            <button type="button" class="social-btn" aria-label="Continue with Google"><i
                    class="fab fa-google"></i></button>
            <button type="button" class="social-btn" aria-label="Continue with Apple"><i
                    class="fab fa-apple"></i></button>
            <button type="button" class="social-btn" aria-label="Continue with Email"><i
                    class="fas fa-envelope"></i></button>
        </div>

        <div style="margin-top: 2.5rem; padding-top: 2rem; border-top: 1.5px solid #f1f5f9; text-align: center;">
            <p style="color: var(--text-muted); font-size: 0.95rem;">
                Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 700;">Register</a>
            </p>
        </div>
    </div>

</body>

</html>
