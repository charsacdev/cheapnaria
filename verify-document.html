<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Verification | CheapNaria</title>
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-container">

    <div class="auth-card auth-card-wide animate-up">
        <div class="auth-header">
            <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 2rem;">
                <img src="images/logo-icon.png" class="logo-icon-img" alt="CheapNaria">
                <span>CheapNaria</span>
            </a>
        </div>

        <div class="verify-progress">
            <div class="verify-progress-step done"><div class="verify-progress-dot"><i class="fas fa-check"></i></div></div>
            <div class="verify-progress-line"></div>
            <div class="verify-progress-step active"><div class="verify-progress-dot">2</div></div>
            <div class="verify-progress-line"></div>
            <div class="verify-progress-step"><div class="verify-progress-dot">3</div></div>
            <div class="verify-progress-line"></div>
            <div class="verify-progress-step"><div class="verify-progress-dot">4</div></div>
        </div>

        <div class="auth-header" style="margin-bottom: 2rem;">
            <h2 style="font-size: 1.8rem; color: var(--secondary); letter-spacing: -1px;">Document verification</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Upload a clear photo of your ID document to
                unlock Tier 2. You can also do this later from your profile.</p>
        </div>

        <div id="uploadArea" class="upload-dropzone">
            <i class="fas fa-cloud-arrow-up"></i>
            <p>Click to upload document</p>
            <small>Passport, Driver's License or Voter's Card &middot; JPG, PNG or PDF</small>
            <input type="file" id="docFileInput" class="d-none" style="display: none;" accept="image/*,.pdf">
        </div>

        <div id="previewArea" class="upload-preview" style="display: none;">
            <i class="fas fa-file-invoice"></i>
            <span class="upload-preview-name" id="docFileName">-</span>
            <button type="button" id="removeDocBtn"><i class="fas fa-times"></i></button>
        </div>

        <button type="button" class="btn btn-primary" id="submitDocBtn" disabled
            style="width: 100%; border-radius: 12px; padding: 1rem; opacity: 0.5;">
            Submit for Review <i class="fas fa-arrow-right ms-2"></i>
        </button>
        <a href="verify-address.html" class="verify-skip-link">Skip for now</a>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/verification.js"></script>
    <script>
        $(document).ready(function () {
            $('#uploadArea').on('click', function () { $('#docFileInput').trigger('click'); });

            $('#docFileInput').on('change', function () {
                const file = this.files[0];
                if (!file) return;
                $('#docFileName').text(file.name);
                $('#uploadArea').hide();
                $('#previewArea').show();
                $('#submitDocBtn').prop('disabled', false).css('opacity', '1');
            });

            $('#removeDocBtn').on('click', function () {
                $('#docFileInput').val('');
                $('#previewArea').hide();
                $('#uploadArea').show();
                $('#submitDocBtn').prop('disabled', true).css('opacity', '0.5');
            });

            $('#submitDocBtn').on('click', function () {
                CN_VERIFY.saveDocument($('#docFileName').text());
                window.location.href = 'verify-address.html';
            });
        });
    </script>
</body>

</html>
